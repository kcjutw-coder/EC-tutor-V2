<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生互動解題畫布 - Gemini 分步引導助教 (支援 PDF 匯出)</title>
  <!-- 引入 html2pdf.js 用於一鍵輸出 PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background: #f4f7f6;
      margin: 0;
      color: #333;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 18px;
    }
    #canvas-container {
      border: 2px solid #333;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    canvas {
      cursor: crosshair;
      display: block;
      border-radius: 6px;
    }
    .chat-panel {
      width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 630px;
    }
    .toolbar {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    #chat-history {
      flex: 1;
      padding: 12px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 6px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 14px;
      word-break: break-word;
    }
    .msg.user {
      background: #e3f2fd;
      align-self: flex-end;
      max-width: 85%;
      border-bottom-right-radius: 2px;
    }
    .msg.model {
      background: #f1f8e9;
      align-self: flex-start;
      max-width: 90%;
      border-bottom-left-radius: 2px;
    }
    button, label.btn {
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #666;
      background: #efefef;
      font-size: 13px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover, label.btn:hover {
      background: #e0e0e0;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      height: 70px;
      padding: 8px;
      border-radius: 4px;
      resize: none;
      box-sizing: border-box;
      border: 1px solid #ccc;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #2196f3;
    }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    .token-badge {
      font-size: 11px;
      background: #e0e0e0;
      padding: 2px 6px;
      border-radius: 4px;
      color: #333;
      align-self: flex-start;
      margin-left: 6px;
    }
    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ccc;
      cursor: pointer;
      padding: 0;
      box-sizing: border-box;
    }
    .color-btn.active {
      border-color: #000;
      transform: scale(1.1);
    }
    
    .api-key-box {
      background: #fff3cd;
      border: 1px solid #ffeba8;
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .api-key-box input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .action-btn {
      background: #e8f5e9;
      border-color: #81c784;
      font-weight: bold;
      color: #2e7d32;
    }
    .pdf-btn {
      background: #e1f5fe;
      border-color: #81d4fa;
      font-weight: bold;
      color: #0277bd;
    }

    /* PDF 匯出專用隱藏範本樣式 */
    #pdf-template {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 左側：繪圖畫布區域 -->
  <div>
    <h3>解題畫布 (支援截圖貼上與圖檔上傳)</h3>
    <div id="canvas-container">
      <canvas id="paintCanvas" width="600" height="450"></canvas>
    </div>
    
    <div class="toolbar">
      <span>畫筆顏色：</span>
      <button class="color-btn active" style="background: #000000;" onclick="setColor('#000000', this)" title="黑色"></button>
      <button class="color-btn" style="background: #e53935;" onclick="setColor('#e53935', this)" title="紅色"></button>
      <button class="color-btn" style="background: #1e88e5;" onclick="setColor('#1e88e5', this)" title="藍色"></button>
      <button class="color-btn" style="background: #43a047;" onclick="setColor('#43a047', this)" title="綠色"></button>
      <button class="color-btn" style="background: #ffffff; border-color: #999;" onclick="setColor('#ffffff', this)" title="橡皮擦 (白色)"></button>
      
      <span style="margin-left: 8px;">粗細：</span>
      <select id="lineWidthSelect" onchange="setLineWidth(this.value)" style="padding: 4px; border-radius: 4px;">
        <option value="2">細</option>
        <option value="4" selected>中</option>
        <option value="8">粗</option>
        <option value="16">超粗(橡皮擦)</option>
      </select>

      <label class="btn" style="margin-left: 8px;">
        📁 上傳圖片
        <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
      </label>
      <button onclick="clearCanvas()">清空畫布</button>
    </div>
    <div class="hint">💡 提示：按 <b>Ctrl+V</b> / <b>Cmd+V</b> 可貼上截圖；選白色畫筆可塗改數字。</div>
  </div>

  <!-- 右側：AI 提問與對話歷史面板 -->
  <div class="chat-panel">
    <h3>電子電路助教系統 <span class="token-badge">🎯 分步引導模式</span></h3>
    
    <div class="api-key-box">
      <input type="password" id="apiKeyInput" placeholder="請貼上你的 Gemini API Key">
      <button onclick="saveApiKey()">儲存 Key</button>
    </div>

    <div id="chat-history">
      <div class="msg model">你好！我是你的 AI 助教。請先在上方填入你的 Gemini API Key 並儲存，接著將題目貼在畫布上，我們就可以開始討論了！點擊「🎲 產生類似題」隨時可以改數字練習喔！</div>
    </div>
    <textarea id="questionInput" placeholder="輸入問題（按 Enter 發送，Shift+Enter 換行）" onkeydown="handleKeyDown(event)"></textarea>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button onclick="askGemini()" id="sendBtn" style="flex: 2;">發送訊息與畫布</button>
      <button onclick="generateSimilarQuestion()" class="action-btn" style="flex: 2;">🎲 產生類似題</button>
      <button onclick="exportToPDF()" class="pdf-btn" style="flex: 2;">📄 輸出 PDF 紀錄</button>
      <button onclick="resetConversation()" style="background: #ffebee; border-color: #ef9a9a; color: #c62828;">重設紀錄</button>
    </div>
  </div>

  <script>
    var chatHistory = []; 
    var canvas, ctx;
    var isDrawing = false;
    var currentColor = '#000000';
    var currentLineWidth = 4;

    function getApiKey() {
      return localStorage.getItem('user_gemini_api_key') || '';
    }

    function saveApiKey() {
      var keyInput = document.getElementById('apiKeyInput');
      var keyVal = keyInput.value.trim();
      if (!keyVal) {
        alert("請輸入有效的 API Key！");
        return;
      }
      localStorage.setItem('user_gemini_api_key', keyVal);
      alert("API Key 儲存成功！");
    }

    function initCanvas() {
      canvas = document.getElementById('paintCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentLineWidth;
      ctx.lineCap = 'round';
    }

    window.addEventListener('DOMContentLoaded', function() {
      var savedKey = getApiKey();
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }

      initCanvas();

      canvas.addEventListener('mousedown', function(e) { 
        isDrawing = true; 
        ctx.beginPath(); 
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentLineWidth;
        ctx.moveTo(e.offsetX, e.offsetY); 
      });

      canvas.addEventListener('mousemove', function(e) { 
        if (isDrawing) { 
          ctx.lineTo(e.offsetX, e.offsetY); 
          ctx.stroke(); 
        } 
      });

      canvas.addEventListener('mouseup', function() { isDrawing = false; });
      canvas.addEventListener('mouseleave', function() { isDrawing = false; });
    });

    function setColor(color, btnEl) {
      currentColor = color;
      if (ctx) ctx.strokeStyle = currentColor;
      var btns = document.querySelectorAll('.color-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      if (btnEl) btnEl.classList.add('active');
    }

    function setLineWidth(width) {
      currentLineWidth = parseInt(width);
      if (ctx) ctx.lineWidth = currentLineWidth;
    }

    function clearCanvas() { initCanvas(); }

    function drawImageToCanvas(imageSource) {
      var img = new Image();
      img.onload = function() {
        initCanvas();
        var scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        var newWidth = img.width * scale;
        var newHeight = img.height * scale;
        var x = (canvas.width - newWidth) / 2;
        var y = (canvas.height - newHeight) / 2;
        ctx.drawImage(img, x, y, newWidth, newHeight);
      };
      img.src = imageSource;
    }

    // 全域上傳圖片處理函式
    function handleFileUpload(event) {
      var file = event.target.files[0];
      if (file && file.type.indexOf('image') !== -1) {
        var reader = new FileReader();
        reader.onload = function(e) { drawImageToCanvas(e.target.result); };
        reader.readAsDataURL(file);
      }
      event.target.value = '';
    }

    // 全域剪貼簿貼上處理
    document.addEventListener('paste', function(event) {
      var clipboardData = event.clipboardData || window.clipboardData;
      if (!clipboardData) return;
      
      var items = clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          var blob = items[i].getAsFile();
          var reader = new FileReader();
          reader.onload = function(e) { drawImageToCanvas(e.target.result); };
          reader.readAsDataURL(blob);
          event.preventDefault();
          break;
        }
      }
    });

    function appendMessage(role, text) {
      var historyDiv = document.getElementById('chat-history');
      var msgDiv = document.createElement('div');
      msgDiv.className = 'msg ' + role;
      msgDiv.innerText = text;
      historyDiv.appendChild(msgDiv);
      historyDiv.scrollTop = historyDiv.scrollHeight;
      return msgDiv;
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        askGemini();
      }
    }

    function resetConversation() {
      chatHistory = [];
      var historyDiv = document.getElementById('chat-history');
      historyDiv.innerHTML = '<div class="msg model">對話已重設！請貼上新題目，我們重新開始分步解題！</div>';
    }

    async function askGemini(overrideQuestion) {
      var userApiKey = getApiKey();
      if (!userApiKey) {
        alert("請先在右上角輸入並儲存你的 Gemini API Key！");
        document.getElementById('apiKeyInput').focus();
        return;
      }

      var questionInput = document.getElementById('questionInput');
      var question = overrideQuestion || questionInput.value.trim();
      var sendBtn = document.getElementById('sendBtn');

      if (!question) {
        alert("請輸入提問內容！");
        return;
      }

      appendMessage('user', question);
      if (!overrideQuestion) questionInput.value = '';
      sendBtn.disabled = true;

      var loadingMsg = appendMessage('model', "AI 助教思考中...");

      try {
        var imageDataUrl = canvas.toDataURL('image/png');
        var base64Data = imageDataUrl.split(',')[1];

        var textOnlyHistory = chatHistory.map(function(item) {
          return {
            role: item.role,
            parts: item.parts.filter(function(part) { return part.text; })
          };
        });

        var currentTurnUserContent = {
          role: "user",
          parts: [
            { text: "學生的最新提問：" + question },
            {
              inline_data: {
                mime_type: "image/png",
                data: base64Data
              }
            }
          ]
        };

        var payloadContents = textOnlyHistory.concat([currentTurnUserContent]);

        var systemPrompt = "你是一位熱心的國高中理科解題助教。\n" +
          "你的【唯一目標】是透過對話，一步步引導學生【自己找出答案】。\n\n" +
          "【對話與教學原則】：\n" +
          "1. 採用「分步引導」策略，【一次只推進一步】或只問一個關鍵問題，絕不一口氣講完全部步驟。\n" +
          "2. 絕對不可以直接給出最終答案或直接代入算式。\n" +
          "3. 每次回應先讚美或肯定學生對的部分，再針對目前步驟提出一個能引導思考的問題或微小提示。\n\n" +
          "【類似題出題規範】：\n" +
          "當學生要求「產生類似題」時，請參考畫布上的原圖結構，重新出一段更換了參數的類似題：\n" +
          "- 請以結構描述（例如：左側支路、右側電阻、輸入電源）或代號來標明新的數值。\n" +
          "- 在說明題目後，親切提示學生：「可以用白色畫筆作為橡皮擦塗改原數字，並寫上新數值」，接著提出第一步引導問題。\n\n" +
          "【數學排版嚴格要求】：\n" +
          "1. 回應中的數學公式與符號，一律使用 Unicode 純文字數學符號（例如：1/3、√x、x²、x₁、π、θ、±、≠、≤、≥）。\n" +
          "2. 絕對不可以使用 LaTeX 語法（嚴禁使用反斜線、美金符號、frac、sqrt 等語法）。";

        var response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=" + userApiKey, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: payloadContents
          })
        });

        var data = await response.json();
        
        if (data.error) {
          loadingMsg.innerText = "[API 錯誤 " + data.error.code + "]: " + data.error.message + "\n(請檢查 API Key 是否正確)";
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          var aiReplyText = data.candidates[0].content.parts[0].text;
          loadingMsg.innerText = aiReplyText;

          chatHistory.push({ role: "user", parts: [{ text: question }] });
          chatHistory.push({ role: "model", parts: [{ text: aiReplyText }] });

        } else {
          loadingMsg.innerText = "收到空回應，請重試。";
        }

      } catch (error) {
        console.error(error);
        loadingMsg.innerText = "網路或程式錯誤：" + error.message;
      } finally {
        sendBtn.disabled = false;
      }
    }

    function generateSimilarQuestion() {
      askGemini("請參考目前畫布上的電路/題目圖形結構，為我出一題替換了參數的類似練習題。請在說明新參數後，提示我可用白色畫筆塗改原圖數字，並問我第一步該如何開始思考。");
    }

    /**
     * 一鍵輸出 PDF 功能
     */
    function exportToPDF() {
      // 取得歷史訊息
      var historyNodes = document.querySelectorAll('#chat-history .msg');
      if (historyNodes.length === 0) {
        alert("目前沒有可輸出的對話紀錄！");
        return;
      }

      // 建立包含排版格式的臨時 HTML DOM
      var pdfWrapper = document.createElement('div');
      pdfWrapper.style.padding = '20px';
      pdfWrapper.style.fontFamily = 'Arial, sans-serif';
      pdfWrapper.style.color = '#333';
      pdfWrapper.style.backgroundColor = '#fff';

      // 標題與時間
      var now = new Date();
      var timeStr = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() + ' ' + 
                     now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      var headerHtml = '<div style="border-bottom: 2px solid #2196f3; padding-bottom: 10px; margin-bottom: 15px;">' +
        '<h1 style="margin:0; font-size: 22px; color: #1976d2;"> Gemini 陪讀助教 - 學習問答紀錄</h1>' +
        '<p style="margin:5px 0 0 0; font-size: 12px; color: #666;">輸出時間：' + timeStr + '</p>' +
        '</div>';

      // 畫布當前圖像擷取
      var canvasImgData = canvas.toDataURL('image/png');
      var canvasHtml = '<div style="margin-bottom: 20px;">' +
        '<h3 style="font-size: 15px; margin-bottom: 8px; color: #444;">當前題目畫布：</h3>' +
        '<div style="text-align: center; border: 1px solid #ddd; padding: 8px; border-radius: 6px; background: #fafafa;">' +
        '<img src="' + canvasImgData + '" style="max-width: 100%; height: auto; max-height: 350px; border-radius: 4px;">' +
        '</div></div>';

      // 對話歷史
      var historyHtml = '<div><h3 style="font-size: 15px; margin-bottom: 10px; color: #444;">對話討論紀錄：</h3>';
      
      historyNodes.forEach(function(node) {
        var isUser = node.classList.contains('user');
        var roleLabel = isUser ? '👤 學生：' : '🤖 AI 助教：';
        var bgColor = isUser ? '#e3f2fd' : '#f1f8e9';
        var align = isUser ? 'right' : 'left';
        var textColor = '#222';

        historyHtml += '<div style="margin-bottom: 12px; clear: both;">' +
          '<div style="font-weight: bold; font-size: 12px; margin-bottom: 3px; color: #555;">' + roleLabel + '</div>' +
          '<div style="background-color: ' + bgColor + '; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; display: inline-block; max-width: 95%; text-align: left;">' +
          escapeHtml(node.innerText) +
          '</div></div>';
      });

      historyHtml += '</div>';

      pdfWrapper.innerHTML = headerHtml + canvasHtml + historyHtml;

      // PDF 導出設定參數
      var opt = {
        margin:       [10, 10, 10, 10], // 上右下左 (mm)
        filename:     'AI問答學習紀錄_' + now.toISOString().slice(0,10) + '.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      // 執行輸出
      html2pdf().set(opt).from(pdfWrapper).save();
    }

    // HTML 轉義字元輔助函式
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
