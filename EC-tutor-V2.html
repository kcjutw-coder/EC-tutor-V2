<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>學生互動解題畫布 - 高畫質電路繪製版</title>
  <style>
    body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; background: #f4f7f6; }
    #canvas-container { border: 2px solid #333; border-radius: 8px; background: #fff; }
    canvas { cursor: crosshair; display: block; }
    .chat-panel { width: 440px; display: flex; flex-direction: column; gap: 10px; height: 630px; }
    .toolbar { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #chat-history { flex: 1; padding: 12px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 8px 12px; border-radius: 6px; line-height: 1.5; white-space: pre-wrap; font-size: 14px; }
    .msg.user { background: #e3f2fd; align-self: flex-end; max-width: 85%; }
    .msg.model { background: #f1f8e9; align-self: flex-start; max-width: 90%; }
    button, label.btn { padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #666; background: #efefef; font-size: 14px; }
    textarea { width: 100%; height: 65px; padding: 8px; border-radius: 4px; resize: none; box-sizing: border-box; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
    .token-badge { font-size: 11px; background: #e0e0e0; padding: 2px 6px; border-radius: 4px; color: #333; align-self: flex-start; }
    .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; padding: 0; }
    .color-btn.active { border-color: #000; transform: scale(1.1); }
    .api-key-box { background: #fff3cd; border: 1px solid #ffeba8; padding: 8px 12px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
    .api-key-box input { flex: 1; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .action-btn { background: #e8f5e9; border-color: #81c784; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 左側：繪圖畫布區域 -->
  <div>
    <h3>解題畫布 (精細電路美化繪製版)</h3>
    <div id="canvas-container">
      <canvas id="paintCanvas" width="600" height="450"></canvas>
    </div>
    
    <div class="toolbar">
      <span>畫筆：</span>
      <button class="color-btn active" style="background: #000000;" onclick="setColor('#000000', this)"></button>
      <button class="color-btn" style="background: #e53935;" onclick="setColor('#e53935', this)"></button>
      <button class="color-btn" style="background: #1e88e5;" onclick="setColor('#1e88e5', this)"></button>
      <button class="color-btn" style="background: #43a047;" onclick="setColor('#43a047', this)"></button>
      
      <select id="lineWidthSelect" onchange="setLineWidth(this.value)">
        <option value="2">細</option>
        <option value="4" selected>中</option>
        <option value="8">粗</option>
      </select>

      <label class="btn">
        📁 上傳圖片
        <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
      </label>
      <button onclick="clearCanvas()">清空畫布</button>
      <button id="restoreBtn" onclick="restoreOriginalCanvas()" style="display: none; background: #e0f7fa;">🔄 切換回上一張題目</button>
    </div>
    <div class="hint">💡 提示：按 <b>Ctrl+V</b> / <b>Cmd+V</b> 可貼上截圖；點選「🎲 產生類似題」畫布會自動繪製新題目！</div>
  </div>

  <!-- 右側：AI 提問面板 -->
  <div class="chat-panel">
    <h3>Gemini 陪讀助教 <span class="token-badge">🎯 電路高清重繪版</span></h3>
    
    <div class="api-key-box">
      <input type="password" id="apiKeyInput" placeholder="請貼上你的 Gemini API Key">
      <button onclick="saveApiKey()">儲存 Key</button>
    </div>

    <div id="chat-history">
      <div class="msg model">你好！我是你的 AI 助教。請貼上電路題目，我們隨時可以分步討論，點擊「🎲 產生類似題」即可自動重繪新電路！</div>
    </div>

    <textarea id="questionInput" placeholder="輸入問題（按 Enter 發送，Shift+Enter 換行）" onkeydown="handleKeyDown(event)"></textarea>
    
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button onclick="askGemini()" id="sendBtn" style="flex: 2;">發送訊息與畫布</button>
      <button onclick="generateSimilarQuestion()" class="action-btn" style="flex: 2;">🎲 產生類似題</button>
      <button onclick="resetConversation()" style="background: #ffebee;">重設</button>
    </div>
  </div>

  <script>
    let chatHistory = []; 
    let originalCanvasBackup = null;

    function getApiKey() { return localStorage.getItem('user_gemini_api_key') || ''; }
    function saveApiKey() {
      const keyVal = document.getElementById('apiKeyInput').value.trim();
      if (!keyVal) return alert("請輸入有效的 API Key！");
      localStorage.setItem('user_gemini_api_key', keyVal);
      alert("API Key 儲存成功！");
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = getApiKey();
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    });

    // ----------------------------------------------------
    // Canvas 基礎互動與繪圖模組
    // ----------------------------------------------------
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false, currentColor = '#000000', currentLineWidth = 4;

    function initCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentLineWidth;
      ctx.lineCap = 'round';
    }
    initCanvas();

    function setColor(color, btnEl) {
      currentColor = color; ctx.strokeStyle = currentColor;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
    }
    function setLineWidth(w) { currentLineWidth = parseInt(w); ctx.lineWidth = currentLineWidth; }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); ctx.strokeStyle = currentColor; ctx.lineWidth = currentLineWidth; ctx.moveTo(e.offsetX, e.offsetY); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);

    function clearCanvas() { initCanvas(); }

    function drawImageToCanvas(imageSource) {
      const img = new Image();
      img.onload = () => {
        initCanvas();
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        const nw = img.width * scale, nh = img.height * scale;
        ctx.drawImage(img, (canvas.width - nw) / 2, (canvas.height - nh) / 2, nw, nh);
      };
      img.src = imageSource;
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => drawImageToCanvas(e.target.result);
        reader.readAsDataURL(file);
      }
      event.target.value = '';
    }

    document.addEventListener('paste', (event) => {
      const clipboardData = event.clipboardData || window.clipboardData;
      if (!clipboardData) return;
      const items = clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const reader = new FileReader();
          reader.onload = (e) => drawImageToCanvas(e.target.result);
          reader.readAsDataURL(items[i].getAsFile());
          event.preventDefault();
          break;
        }
      }
    });

    // ----------------------------------------------------
    // 🎨 高畫質 JSON 電路重繪繪圖器 (適配本題特徵)
    // ----------------------------------------------------
    function renderCircuitFromJSON(cfg) {
      originalCanvasBackup = canvas.toDataURL();
      document.getElementById('restoreBtn').style.display = 'inline-block';
      initCanvas();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.font = '16px "Times New Roman", serif';
      ctx.fillStyle = '#000000';

      // 1. 主線路外框 (左邊 Vs，中間 Resistor，右邊 Branch 與 Vo)
      const leftX = 120, rightX = 350, voX = 450;
      const topY = 100, bottomY = 320;

      ctx.beginPath();
      // 上方迴路：從左電壓源頂部 -> 電阻前 -> 電阻後 -> 右側節點 -> Vo 端點
      ctx.moveTo(leftX, topY + 40);
      ctx.lineTo(leftX, topY);
      ctx.lineTo(180, topY);

      // 電阻後半段 -> 支路 -> Vo
      ctx.moveTo(280, topY);
      ctx.lineTo(rightX, topY);
      ctx.lineTo(voX, topY);

      // 下方迴路
      ctx.moveTo(leftX, bottomY - 40);
      ctx.lineTo(leftX, bottomY);
      ctx.lineTo(rightX, bottomY);
      ctx.lineTo(voX, bottomY);
      ctx.stroke();

      // 2. 繪製左側直流電源 (Vs) - 標準電池符號
      drawBattery(leftX, topY + 40, bottomY - 40, cfg.vs || '10V');

      // 3. 繪製電阻 (Resistor)
      drawResistor(180, topY, 100, cfg.resistor || '2kΩ');

      // 4. 中間支路 (二極體 + 直流電源)
      ctx.beginPath();
      ctx.arc(rightX, topY, 4, 0, Math.PI * 2); ctx.fill();
      ctx.arc(rightX, bottomY, 4, 0, Math.PI * 2); ctx.fill();

      // 繪製二極體
      drawDiode(rightX, topY + 40, cfg.diode_dir || 'down', cfg.vd_label || 'D');

      // 繪製二極體下方的直流電源
      ctx.beginPath();
      ctx.moveTo(rightX, topY + 80);
      ctx.lineTo(rightX, topY + 120);
      ctx.stroke();

      drawBattery(rightX, topY + 120, bottomY, cfg.v_dc || '3V', cfg.v_dc_polar || 'top_positive');

      // 5. 右側 Vo 端點與 +- 標籤
      ctx.beginPath();
      ctx.arc(voX, topY, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.arc(voX, bottomY, 4, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = '#0055b8'; // 藍色標註 Vo
      ctx.font = 'bold 18px serif';
      ctx.fillText('+', voX - 5, topY + 30);
      ctx.fillText('-', voX - 4, bottomY - 15);
      ctx.fillText('Vₒ', voX - 10, (topY + bottomY) / 2 + 5);
    }

    // 🛠️ 輔助繪圖：標準電池符號 (長線正極，短厚線負極)
    function drawBattery(x, topY, bottomY, label, polarity = 'top_positive') {
      const midY = (topY + bottomY) / 2;
      ctx.beginPath();
      ctx.moveTo(x, topY); ctx.lineTo(x, midY - 15);
      ctx.moveTo(x, midY + 15); ctx.lineTo(x, bottomY);
      ctx.stroke();

      ctx.lineWidth = 3;
      if (polarity === 'top_positive') {
        // 上長下短
        ctx.beginPath(); ctx.moveTo(x - 20, midY - 10); ctx.lineTo(x + 20, midY - 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 10, midY + 10); ctx.lineTo(x + 10, midY + 10); ctx.stroke();
        ctx.font = '16px sans-serif'; ctx.fillStyle = '#000';
        ctx.fillText('+', x - 35, midY - 5);
        ctx.fillText('-', x - 32, midY + 15);
      } else {
        // 上短下長
        ctx.beginPath(); ctx.moveTo(x - 10, midY - 10); ctx.lineTo(x + 10, midY - 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 20, midY + 10); ctx.lineTo(x + 20, midY + 10); ctx.stroke();
        ctx.font = '16px sans-serif'; ctx.fillStyle = '#000';
        ctx.fillText('-', x - 32, midY - 5);
        ctx.fillText('+', x - 35, midY + 15);
      }
      ctx.lineWidth = 2;
      ctx.fillText(label, x - 75, midY + 5);
    }

    // 🛠️ 輔助繪圖：美化電阻 (鋸齒形)
    function drawResistor(x, y, length, label) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      const seg = length / 6;
      ctx.lineTo(x + seg * 0.5, y - 12);
      ctx.lineTo(x + seg * 1.5, y + 12);
      ctx.lineTo(x + seg * 2.5, y - 12);
      ctx.lineTo(x + seg * 3.5, y + 12);
      ctx.lineTo(x + seg * 4.5, y - 12);
      ctx.lineTo(x + seg * 5.5, y + 12);
      ctx.lineTo(x + length, y);
      ctx.stroke();

      ctx.font = '16px serif'; ctx.fillStyle = '#000';
      ctx.fillText(label, x + 30, y - 20);
    }

    // 🛠️ 輔助繪圖：實心二極體
    function drawDiode(x, y, dir, label) {
      ctx.beginPath();
      ctx.moveTo(x, y - 20); ctx.lineTo(x, y + 20); ctx.stroke();

      ctx.beginPath();
      if (dir === 'down') {
        ctx.moveTo(x - 12, y - 10); ctx.lineTo(x + 12, y - 10); ctx.lineTo(x, y + 10); ctx.closePath();
        ctx.fillStyle = '#000'; ctx.fill(); // 黑色填滿
        ctx.beginPath(); ctx.moveTo(x - 12, y + 10); ctx.lineTo(x + 12, y + 10); ctx.stroke(); // 擋板
      } else {
        ctx.moveTo(x - 12, y + 10); ctx.lineTo(x + 12, y + 10); ctx.lineTo(x, y - 10); ctx.closePath();
        ctx.fillStyle = '#000'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(x - 12, y - 10); ctx.lineTo(x + 12, y - 10); ctx.stroke();
      }
      ctx.font = 'italic 16px serif';
      ctx.fillText(label, x - 25, y + 5);
    }

    function restoreOriginalCanvas() {
      if (originalCanvasBackup) {
        drawImageToCanvas(originalCanvasBackup);
        document.getElementById('restoreBtn').style.display = 'none';
      }
    }

    // ----------------------------------------------------
    // UI 與 API 對話邏輯
    // ----------------------------------------------------
    function appendMessage(role, text) {
      const historyDiv = document.getElementById('chat-history');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.innerText = text;
      historyDiv.appendChild(msgDiv);
      historyDiv.scrollTop = historyDiv.scrollHeight;
      return msgDiv;
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askGemini(); }
    }

    function resetConversation() {
      chatHistory = [];
      document.getElementById('chat-history').innerHTML = '<div class="msg model">對話已重設！請貼上新題目開始討論。</div>';
    }

    async function askGemini(overrideQuestion = null) {
      const userApiKey = getApiKey();
      if (!userApiKey) {
        alert("請先在右上角輸入並儲存你的 Gemini API Key！");
        return document.getElementById('apiKeyInput').focus();
      }

      const questionInput = document.getElementById('questionInput');
      const question = overrideQuestion || questionInput.value.trim();
      if (!question) return alert("請輸入提問內容！");

      appendMessage('user', question);
      if (!overrideQuestion) questionInput.value = '';
      document.getElementById('sendBtn').disabled = true;

      const loadingMsg = appendMessage('model', "AI 助教思考中...");

      try {
        const imageDataUrl = canvas.toDataURL('image/png');
        const base64Data = imageDataUrl.split(',')[1];

        const textOnlyHistory = chatHistory.map(item => ({
          role: item.role, parts: item.parts.filter(p => p.text)
        }));

        const currentTurnUserContent = {
          role: "user",
          parts: [
            { text: `學生的最新提問：${question}` },
            { inline_data: { mime_type: "image/png", data: base64Data } }
          ]
        };

        const systemPrompt = `你是一位熱心的理科解題助教，目標是透過分步問答引導學生自己找出答案。
絕不直接給答案，且數學符號一律使用 Unicode 純文字（不使用 LaTeX）。

【類似題 JSON 繪圖規範】：
當學生要求「產生類似題」時，請列出新參數並在最後附上 json 區塊：
\`\`\`json
{
  "vs": "10V",
  "resistor": "2kΩ",
  "vd_label": "D",
  "diode_dir": "down",
  "v_dc": "3V",
  "v_dc_polar": "top_positive"
}
\`\`\``;

        const requestBody = {
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [...textOnlyHistory, currentTurnUserContent]
        };

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${userApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        
        if (data.error) {
          loadingMsg.innerText = `[API 錯誤 ${data.error.code}]: ${data.error.message}`;
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          const aiReplyText = data.candidates[0].content.parts[0].text;
          
          const jsonMatch = aiReplyText.match(/```json\s*([\s\S]*?)\s*```/);
          if (jsonMatch) {
            try {
              const circuitConfig = JSON.parse(jsonMatch[1]);
              renderCircuitFromJSON(circuitConfig);
            } catch (err) { console.error("JSON 解析失敗:", err); }
          }

          const cleanDisplayText = aiReplyText.replace(/```json[\s\S]*?```/g, '').trim();
          loadingMsg.innerText = cleanDisplayText;

          chatHistory.push({ role: "user", parts: [{ text: question }] });
          chatHistory.push({ role: "model", parts: [{ text: cleanDisplayText }] });
        }
      } catch (error) {
        loadingMsg.innerText = "網路或程式錯誤：" + error.message;
      } finally {
        document.getElementById('sendBtn').disabled = false;
      }
    }

    function generateSimilarQuestion() {
      askGemini("請根據目前這道直流二極體電路圖，出一題改換數字的類似練習題，附上 json 參數，並問我第一步該如何判斷二極體導通狀態。");
    }
  </script>
</body>
</html>
